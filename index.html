<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Othello Web App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Othello (Reversi)</h1>
      <p class="subtitle">Play in your browser: Human vs Human or Human vs Computer</p>
    </header>

    <section class="controls">
      <label for="mode">Game Mode:</label>
      <select id="mode">
        <option value="hvh">Human vs Human</option>
        <option value="hvc">Human vs Computer (Computer = White)</option>
      </select>
      <button id="new-game">New Game</button>
    </section>

    <section class="status-panel">
      <p id="turn">Current turn: Black</p>
      <p id="score">Score — Black: 2 | White: 2</p>
      <p id="message"></p>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Othello board"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
